<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fashion Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <header class="login-header">
        <a href="../index.html" class="brand">FASHION<span>.</span></a>
        <a href="../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Store
        </a>
    </header>

    <main class="login-page">
        <div class="login-card">

            <div class="login-picture">
                <div class="picture-text">
                    <p>WELCOME BACK</p>
                    <h1>Your Style.<br>Your Story.</h1>
                    <span>Discover fashion that feels like you.</span>
                </div>
            </div>

            <div class="login-form-area">
                <div class="form-heading">
                    <p class="eyebrow">GOOD TO SEE YOU</p>
                    <h2>Login to your account</h2>
                    <p>Enter your details to continue.</p>
                </div>

                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com"
                            autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>

                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-option">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>

                        <a href="signup.html">Create an account?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        Login <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="signup-note">
                    Don't have an account?
                    <a href="signup.html">Sign up</a>
                </div>

                <div class="store-note">
                    <a href="../index.html">Continue browsing the store</a>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
