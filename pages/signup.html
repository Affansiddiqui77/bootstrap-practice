<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Fashion Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../styles/signup.css">
</head>

<body>

    <header class="signup-header">
        <a href="../index.html" class="brand">FASHION<span>.</span></a>

        <a href="../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Store
        </a>
    </header>

    <main class="signup-page">
        <div class="signup-card">

            <div class="signup-picture">
                <div class="picture-text">
                    <p>YOUR STYLE STARTS HERE</p>
                    <h1>Be Yourself.<br>Wear Your Style.</h1>
                    <span>Join us and discover your next favourite look.</span>
                </div>
            </div>

            <div class="signup-form-area">
                <div class="form-heading">
                    <p class="eyebrow">CREATE YOUR ACCOUNT</p>
                    <h2>Join Fashion Store</h2>
                    <p>Enter your details to get started.</p>
                </div>

                <form action="#" method="post">

                    <div class="mb-3">
                        <label for="fullname" class="form-label">Full Name</label>

                        <input type="text" class="form-control" id="fullname" name="fullname"
                            placeholder="Enter your full name" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>

                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com"
                            autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>

                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Create a password" autocomplete="new-password" minlength="8" required>

                        <small class="password-help">
                            Use at least 8 characters.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">
                            Confirm Password
                        </label>

                        <input type="password" class="form-control" id="confirm-password" name="confirm_password"
                            placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                    </div>

                    <div class="terms-option">
                        <input type="checkbox" id="terms" name="terms" required>

                        <label for="terms">
                            I agree to the terms and conditions.
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        Create Account <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

                <div class="login-note">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

                <div class="store-note">
                    <a href="../index.html">Continue browsing the store</a>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
